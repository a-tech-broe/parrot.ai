name: CI/CD — Parrot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One active run per branch; cancel superseded runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION:     ${{ vars.AWS_REGION     || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'parrot'    }}

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ── A. Bootstrap EC2 ─────────────────────────────────────────────────────────
  # Runs in parallel with tests so it adds zero wall-clock time.
  # Idempotent: skips each tool if already installed.
  # Skipped on PRs (no deployment target needed).
  # ─────────────────────────────────────────────────────────────────────────────
  bootstrap-ec2:
    name: Bootstrap EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Install Docker + AWS CLI + curl (idempotent)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          timeout:  300s
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive

            # ── Docker ────────────────────────────────────────────────────────
            if command -v docker &>/dev/null; then
              echo "✓ Docker already installed: $(docker --version)"
            else
              echo "→ Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              . /etc/os-release
              echo \
                "deb [arch=$(dpkg --print-architecture) \
                     signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y \
                docker-ce docker-ce-cli containerd.io docker-buildx-plugin
              sudo systemctl enable --now docker
              sudo usermod -aG docker "$USER"
              echo "✓ Docker installed: $(sudo docker --version)"
            fi

            # ── AWS CLI ───────────────────────────────────────────────────────
            if command -v aws &>/dev/null; then
              echo "✓ AWS CLI already installed: $(aws --version 2>&1)"
            else
              echo "→ Installing AWS CLI v2..."
              sudo apt-get install -y unzip
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
                -o /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp
              sudo /tmp/aws/install
              rm -rf /tmp/aws /tmp/awscliv2.zip
              echo "✓ AWS CLI installed: $(aws --version 2>&1)"
            fi

            # ── curl (health-check dependency) ────────────────────────────────
            if command -v curl &>/dev/null; then
              echo "✓ curl already present"
            else
              sudo apt-get install -y curl
              echo "✓ curl installed"
            fi

            echo ""
            echo "EC2 bootstrap complete ✓"

  # ── B. Backend unit tests ─────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: |
          mkdir -p reports
          pytest \
            --ignore=tests/smoke \
            -v \
            --junitxml=reports/backend-junit.xml \
            --cov=. \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: reports/
          retention-days: 30

  # ── C. Frontend unit tests ────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Vitest
        run: cd frontend && npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: frontend/reports/
          retention-days: 30

  # ── D. Dependency security scan ───────────────────────────────────────────────
  scan-dependencies:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: pip-audit (Python)
        run: |
          mkdir -p reports
          pip install pip-audit
          pip-audit -r requirements.txt \
            --format json \
            --output reports/pip-audit.json \
            --progress-spinner off 2>/dev/null || true
          # Human-readable output; fails on high/critical
          pip-audit -r requirements.txt --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit (Frontend)
        run: |
          cd frontend && npm ci --ignore-scripts
          npm audit --json > ../reports/npm-audit.json 2>&1 || true
          npm audit --audit-level=high

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-results
          path: reports/
          retention-days: 30

  # ── E. Build → Ensure ECR → Scan → Push ──────────────────────────────────────
  # On main: full pipeline (build, create ECR repo if needed, scan, push)
  # On PRs : build + scan only (no AWS credentials needed, no push)
  # ─────────────────────────────────────────────────────────────────────────────
  build-scan-push:
    name: Build · Scan · Push
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      image:        ${{ steps.meta.outputs.image }}
      ecr-registry: ${{ steps.meta.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      # ── AWS auth (main branch only) ──────────────────────────────────────────
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Ensure ECR repository exists (idempotent) ────────────────────────────
      - name: Create ECR repository + lifecycle policy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" 2>/dev/null \
          || aws ecr create-repository \
               --repository-name "$ECR_REPOSITORY" \
               --image-scanning-configuration scanOnPush=true \
               --encryption-configuration encryptionType=AES256 \
               --region "$AWS_REGION"

          # Keep last 10 tagged images; expire untagged after 1 day
          aws ecr put-lifecycle-policy \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --lifecycle-policy-text '{
              "rules": [
                {
                  "rulePriority": 1,
                  "description": "Expire untagged images after 1 day",
                  "selection": {
                    "tagStatus": "untagged",
                    "countType": "sinceImagePushed",
                    "countUnit": "days",
                    "countNumber": 1
                  },
                  "action": { "type": "expire" }
                },
                {
                  "rulePriority": 2,
                  "description": "Keep last 10 tagged images",
                  "selection": {
                    "tagStatus": "any",
                    "countType": "imageCountMoreThan",
                    "countNumber": 10
                  },
                  "action": { "type": "expire" }
                }
              ]
            }'

          echo "ECR repository ready ✓"

      # ── Resolve image tag ────────────────────────────────────────────────────
      - name: Compute image reference
        id: meta
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          if [ -n "$REGISTRY" ]; then
            IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          else
            # PR builds: local tag only, never pushed
            IMAGE="parrot:${{ github.sha }}"
            REGISTRY=""
          fi
          echo "image=$IMAGE"       >> "$GITHUB_OUTPUT"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      # ── Build (local, not pushed yet) ────────────────────────────────────────
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to:   type=local,dest=/tmp/.buildx-cache-new,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── Trivy container scan ─────────────────────────────────────────────────
      - name: Trivy — SARIF (GitHub Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format:    sarif
          output:    trivy.sarif
          severity:  CRITICAL,HIGH
          exit-code: '0'

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category:   container-scan

      - name: Trivy — fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format:    table
          severity:  CRITICAL
          exit-code: '1'

      - name: Trivy — full HTML report
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format:    template
          template:  '@/contrib/html.tpl'
          output:    reports/trivy-report.html
          severity:  CRITICAL,HIGH,MEDIUM

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: reports/trivy-report.html
          retention-days: 30

      # ── Push to ECR (main only, after scan passes) ───────────────────────────
      - name: Push image to ECR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE:    ${{ steps.meta.outputs.image }}
          REGISTRY: ${{ steps.meta.outputs.registry }}
        run: |
          docker push "$IMAGE"
          docker tag  "$IMAGE" "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "Pushed $IMAGE ✓"

  # ── F. Deploy to EC2 ──────────────────────────────────────────────────────────
  # Waits for BOTH the image to be in ECR (build-scan-push)
  # AND the EC2 to have Docker + AWS CLI (bootstrap-ec2).
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: [build-scan-push, bootstrap-ec2]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ secrets.EC2_HOST }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE:    ${{ needs.build-scan-push.outputs.image }}
          REGION:   ${{ env.AWS_REGION }}
          REGISTRY: ${{ needs.build-scan-push.outputs.ecr-registry }}
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          port:     22
          envs:     IMAGE,REGION,REGISTRY
          timeout:  180s
          script: |
            set -euo pipefail

            echo "=== Authenticating to ECR ==="
            aws ecr get-login-password --region "$REGION" \
              | sudo docker login --username AWS --password-stdin "$REGISTRY"

            echo "=== Storing rollback target ==="
            PREVIOUS=$(sudo docker inspect parrot \
              --format='{{.Config.Image}}' 2>/dev/null || true)

            echo "=== Pulling $IMAGE ==="
            sudo docker pull "$IMAGE"

            echo "=== Replacing container ==="
            sudo docker stop --time=30 parrot 2>/dev/null || true
            sudo docker rm               parrot 2>/dev/null || true

            sudo docker run -d \
              --name parrot \
              --restart unless-stopped \
              -p 80:8000 \
              --health-cmd 'curl -sf http://localhost:8000/ || exit 1' \
              --health-interval 30s \
              --health-timeout 10s \
              --health-retries 3 \
              --health-start-period 40s \
              --log-driver json-file \
              --log-opt max-size=50m \
              --log-opt max-file=3 \
              "$IMAGE"

            echo "=== Waiting for healthy status ==="
            for i in $(seq 1 12); do
              STATUS=$(sudo docker inspect \
                --format='{{.State.Health.Status}}' parrot 2>/dev/null \
                || echo "unknown")
              echo "  Attempt $i/12: $STATUS"
              [ "$STATUS" = "healthy" ] && break
              if [ "$i" -eq 12 ]; then
                echo "ERR: Health check timed out — rolling back"
                sudo docker stop parrot 2>/dev/null || true
                sudo docker rm   parrot 2>/dev/null || true
                if [ -n "$PREVIOUS" ]; then
                  sudo docker run -d \
                    --name parrot \
                    --restart unless-stopped \
                    -p 80:8000 \
                    "$PREVIOUS"
                  echo "Rolled back to $PREVIOUS"
                fi
                exit 1
              fi
              sleep 10
            done

            sudo docker image prune -f
            echo "=== Deploy complete: $IMAGE ==="

  # ── G. Smoke tests ────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Tests
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install smoke-test dependencies
        run: pip install requests junit-xml

      - name: Wait for service
        run: |
          echo "Polling http://${{ secrets.EC2_HOST }} ..."
          for i in $(seq 1 18); do
            if curl -sf --max-time 5 "http://${{ secrets.EC2_HOST }}/"; then
              echo "Service is up ✓"
              break
            fi
            echo "  Attempt $i/18 — retrying in 10s"
            sleep 10
            [ "$i" -eq 18 ] && echo "ERR: timed out" && exit 1
          done

      - name: Run smoke tests
        run: |
          python tests/smoke/smoke_test.py \
            --url  "http://${{ secrets.EC2_HOST }}" \
            --output reports/smoke-junit.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: reports/smoke-junit.xml
          retention-days: 30

  # ── H. Report (always runs) ───────────────────────────────────────────────────
  report:
    name: Report
    needs:
      - bootstrap-ec2
      - test-backend
      - test-frontend
      - scan-dependencies
      - build-scan-push
      - deploy
      - smoke-test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
        continue-on-error: true

      - name: Write GitHub Step Summary
        env:
          R_BOOTSTRAP: ${{ needs.bootstrap-ec2.result }}
          R_BACKEND:   ${{ needs.test-backend.result }}
          R_FRONTEND:  ${{ needs.test-frontend.result }}
          R_DEPS:      ${{ needs.scan-dependencies.result }}
          R_BUILD:     ${{ needs.build-scan-push.result }}
          R_DEPLOY:    ${{ needs.deploy.result }}
          R_SMOKE:     ${{ needs.smoke-test.result }}
          IMAGE:       ${{ needs.build-scan-push.outputs.image }}
        run: |
          icon() {
            case $1 in
              success)   printf '✅' ;;
              failure)   printf '❌' ;;
              skipped)   printf '⏭️' ;;
              cancelled) printf '🚫' ;;
              *)         printf '⚠️' ;;
            esac
          }

          OVERALL=success
          for s in "$R_BACKEND" "$R_FRONTEND" "$R_BUILD" "$R_DEPLOY" "$R_SMOKE"; do
            [ "$s" = "failure" ] && OVERALL=failure
          done

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # 🦜 Parrot — Pipeline Report

          **Overall:** $(icon $OVERALL) ${OVERALL^^}
          **Commit:** \`${{ github.sha }}\`
          **Branch:** \`${{ github.ref_name }}\`
          **Actor:**  ${{ github.actor }}
          **Run:**    [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ## Jobs

          | Job | Result |
          |-----|--------|
          | EC2 Bootstrap       | $(icon $R_BOOTSTRAP) $R_BOOTSTRAP |
          | Backend Tests       | $(icon $R_BACKEND)   $R_BACKEND   |
          | Frontend Tests      | $(icon $R_FRONTEND)  $R_FRONTEND  |
          | Dependency Scan     | $(icon $R_DEPS)      $R_DEPS      |
          | Build · Scan · Push | $(icon $R_BUILD)     $R_BUILD     |
          | Deploy to EC2       | $(icon $R_DEPLOY)    $R_DEPLOY    |
          | Smoke Tests         | $(icon $R_SMOKE)     $R_SMOKE     |

          ## Image
          \`\`\`
          $IMAGE
          \`\`\`
          EOF

      - name: Notify Slack
        if: vars.SLACK_NOTIFICATIONS == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "${{ needs.smoke-test.result == 'success' && '✅' || needs.deploy.result == 'skipped' && '🔍' || '❌' }} *Parrot* — ${{ needs.smoke-test.result == 'success' && 'deployed successfully' || needs.deploy.result == 'skipped' && 'PR checks passed' || 'pipeline failed' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ needs.smoke-test.result == 'success' && '✅ Deployed' || needs.deploy.result == 'skipped' && '🔍 PR Checks Passed' || '❌ Pipeline Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Branch:*\n`${{ github.ref_name }}`" },
                    { "type": "mrkdwn", "text": "*Commit:*\n`${{ github.sha }}`" },
                    { "type": "mrkdwn", "text": "*Actor:*\n${{ github.actor }}" },
                    { "type": "mrkdwn", "text": "*Host:*\nhttp://${{ secrets.EC2_HOST }}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [{
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View Run" },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }]
                }
              ]
            }
